## ==========================================
## FlowStudy Application Configuration
## ==========================================

## Server Configuration
server.port=8080
server.servlet.context-path=/api

## Application Name
spring.application.name=flowstudy

## Database Configuration (Phase 1: H2 in-memory for testing)
# 將在 Phase 2 切換到 PostgreSQL
spring.datasource.url=jdbc:h2:mem:flowstudydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

## JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

## H2 Console (便於開發期間查看數據庫)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

## Redis Configuration (Phase 3: 實時房間狀態)
# 暫時禁用，Phase 3 啟用
spring.redis.enabled=false

## Logging Configuration
logging.level.root=INFO
logging.level.com.flowstudy=DEBUG

## WebSocket Configuration
spring.websocket.allowed-origins=*

## JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-timezone=UTC

## Application Profiles
spring.profiles.active=dev
